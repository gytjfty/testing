<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZipBench — website editor</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#10141e;color:#e5eaf5}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:10px;padding:12px;background:#192132;flex-wrap:wrap}h1{font-size:19px;margin:0 14px 0 0}button,select,input{font:inherit;background:#27344d;color:inherit;border:1px solid #43516c;border-radius:5px;padding:7px}button{cursor:pointer}button:hover{background:#374968}#status{padding:8px 14px;color:#adbedb;min-height:34px}.layout{display:grid;grid-template-columns:210px minmax(240px,1fr) minmax(280px,1fr);height:calc(100vh - 180px);min-height:380px}aside{overflow:auto;padding:8px;background:#151c29}aside button{display:block;text-align:left;width:100%;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}aside .active{background:#375b88}section{min-width:0;display:flex;flex-direction:column;border-left:1px solid #364158}.bar{padding:8px;background:#1b2537;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#filename{flex:1;overflow:hidden;text-overflow:ellipsis}textarea{flex:1;width:100%;resize:none;background:#0e1420;color:#e3eaf9;border:0;padding:14px;outline:none;font:14px/1.6 ui-monospace,monospace;tab-size:2}iframe{background:white;border:0;width:100%;flex:1}#console{height:110px;overflow:auto;margin:0;padding:10px;font:12px/1.5 monospace;background:#090e17;white-space:pre-wrap}footer{font-size:12px;padding:8px;color:#acb9d0}input[type=file]{display:none}@media(max-width:850px){.layout{grid-template-columns:145px 1fr;height:auto}section{height:55vh}section:last-child{grid-column:1/-1}}
</style></head><body><header><h1>ZipBench</h1><button id="open">Open ZIP</button><input id="zip" type="file" accept=".zip,application/zip"><button id="new">New file</button><button id="rename">Rename</button><button id="delete">Delete</button><button id="export">Export ZIP</button><button id="run">Run / refresh</button><label><input id="auto" type="checkbox"> Auto-run</label><button id="check">Check project</button></header><div id="status" role="status">Loading ZIP library…</div><main class="layout"><aside id="files" aria-label="Project files"></aside><section><div class="bar"><span id="filename">Select a file</span><span id="size"></span></div><textarea id="editor" spellcheck="false" aria-label="Source editor"></textarea></section><section><div class="bar"><label>Entry <select id="entry"></select></label><select id="width" aria-label="Preview width"><option value="100%">Responsive</option><option value="375px">Phone 375px</option><option value="768px">Tablet 768px</option></select></div><iframe id="preview" title="Sandboxed project preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></section></main><pre id="console" aria-label="Preview console"></pre><footer>Browser-ready static sites only. Imported code runs in a sandbox; network access is not blocked. Changes live in memory until exported. Ctrl/Cmd+S exports ZIP. Ctrl/Cmd+Enter runs.</footer>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
'use strict';
const $=id=>document.getElementById(id), enc=new TextEncoder(),dec=new TextDecoder();
let files=new Map(),current='',dirty=false,timer,token='';
const textual=p=>/\.(html?|css|[cm]?js|json|md|txt|svg|xml|yml|yaml|csv|ts|tsx|jsx|map|gitignore)$/i.test(p)||!p.split('/').pop().includes('.');
const mime=p=>({'html':'text/html','htm':'text/html','css':'text/css','js':'text/javascript','mjs':'text/javascript','json':'application/json','svg':'image/svg+xml','png':'image/png','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif','webp':'image/webp','ico':'image/x-icon','woff':'font/woff','woff2':'font/woff2','mp3':'audio/mpeg','mp4':'video/mp4','pdf':'application/pdf','txt':'text/plain'})[p.split('.').pop().toLowerCase()]||'application/octet-stream';
function status(s){$('status').textContent=s}function log(s){$('console').textContent+=s+'\n';$('console').scrollTop=$('console').scrollHeight}
function safe(p){if(p.includes('\\')||p.startsWith('/')||p.split('/').includes('..')||!p)return false;return true}
function save(){if(current&&textual(current)&&!$('editor').disabled)files.set(current,enc.encode($('editor').value))}
function list(){const old=$('entry').value;$('files').replaceChildren();$('entry').replaceChildren();for(const p of [...files.keys()].sort()){const b=document.createElement('button');b.textContent=p;b.title=p;b.className=p===current?'active':'';b.onclick=()=>select(p);$('files').append(b);if(/\.html?$/i.test(p)){const o=new Option(p,p);$('entry').add(o)}}if(files.has(old))$('entry').value=old;else{const candidates=[...files.keys()].filter(p=>/(^|\/)index\.html?$/i.test(p)).sort((a,b)=>a.split('/').length-b.split('/').length);if(candidates.length)$('entry').value=candidates[0]}}
function select(p){save();current=p;$('filename').textContent=p;$('size').textContent=files.get(p).length+' bytes';$('editor').disabled=!textual(p);$('editor').value=textual(p)?dec.decode(files.get(p)):'Binary asset — preserved on ZIP export.';list()}
$('editor').addEventListener('input',()=>{dirty=true;save();clearTimeout(timer);if($('auto').checked)timer=setTimeout(run,700)});
$('editor').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target,a=t.selectionStart,b=t.selectionEnd;t.setRangeText('  ',a,b,'end');t.dispatchEvent(new Event('input'))}});
$('open').onclick=()=>$('zip').click();$('zip').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(dirty&&!confirm('Replace this project? Export first to keep your changes.'))return;try{if(f.size>40*1024*1024)throw Error('ZIP exceeds the 40 MB compressed-size limit.');status('Reading ZIP…');const z=await JSZip.loadAsync(f),next=new Map();let total=0;const entries=Object.values(z.files).filter(x=>!x.dir);if(entries.length>2500)throw Error('Maximum 2,500 files.');for(const entry of entries){const p=entry.name;if(!safe(p))throw Error('Unsafe archive path: '+p);const data=await entry.async('uint8array');total+=data.length;if(total>100*1024*1024)throw Error('Expanded project exceeds 100 MB.');next.set(p,data)}files=next;current='';dirty=false;list();if($('entry').value)select($('entry').value);else if(files.size)select(files.keys().next().value);status(`Opened ${files.size} files. Select an HTML entry and Run.`);log('ZIP imported. Archive limits are convenience checks, not protection from hostile compressed archives.')}catch(err){status('Import failed: '+err.message)}finally{e.target.value=''}};
$('new').onclick=()=>{const p=prompt('New project-relative path, e.g. css/style.css');if(p===null)return;if(!safe(p)||files.has(p))return status('Invalid path or file already exists.');save();files.set(p,enc.encode(''));dirty=true;select(p)};
$('rename').onclick=()=>{if(!current)return;const p=prompt('New path (references are not automatically updated)',current);if(p===null||p===current)return;if(!safe(p)||files.has(p))return status('Invalid path or file already exists.');save();const data=files.get(current);files.delete(current);files.set(p,data);current='';dirty=true;select(p)};
$('delete').onclick=()=>{if(current&&confirm('Delete '+current+'?')){files.delete(current);current='';$('editor').value='';dirty=true;list();if(files.size)select(files.keys().next().value)}};
$('export').onclick=async()=>{try{save();const z=new JSZip();for(const [p,b]of files)z.file(p,b);const blob=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='website-project.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);dirty=false;status('Project exported.')}catch(e){status(e.message)}};
// This function is serialized into an opaque-origin sandbox. No project code runs in the editor.
function sandboxBoot(payload){
const F=new Map(payload.files.map(([p,a])=>[p,new Uint8Array(a)])),D=new TextDecoder(),T=payload.types,U=new Map(),V='https://zipbench.invalid/';
const send=(kind,args)=>parent.postMessage({zipbench:payload.token,kind,args},'*');
const show=x=>{try{return typeof x==='string'?x:JSON.stringify(x)}catch{return String(x)}};
for(const k of ['log','info','warn','error','debug']){const original=console[k].bind(console);console[k]=(...a)=>{send(k,a.map(show));original(...a)}}
addEventListener('error',e=>send('error',[e.message||'Resource failed: '+(e.target.src||e.target.href||'unknown')]),true);addEventListener('unhandledrejection',e=>send('error',[show(e.reason)]));
function resolve(raw,from){if(!raw||/^(data:|blob:|https?:|\/\/|#|mailto:|tel:|javascript:)/i.test(raw))return null;try{const u=new URL(raw,V+from);return {p:decodeURIComponent(u.pathname.slice(1)),hash:u.hash,search:u.search}}catch{return null}}
function asset(raw,from){const r=resolve(raw,from);if(!r)return raw;const u=U.get(r.p);if(!u){send('missing',[raw+' (from '+from+')']);return raw}return u+r.hash}
function imports(s,p){return s.replace(/(\b(?:import|export)\s+(?:[^;'"\n]*?\s+from\s*)?)(['"])([^'"\n]+)\2/g,(all,a,q,v)=>{const r=resolve(v,p);return r&&(v.startsWith('.')||v.startsWith('/'))?a+q+V+r.p+q:all}).replace(/(\bimport\s*\(\s*)(['"])([^'"\n]+)\2/g,(all,a,q,v)=>{const r=resolve(v,p);return r&&(v.startsWith('.')||v.startsWith('/'))?a+q+V+r.p+q:all})}
function css(s,p){return s.replace(/url\(\s*(['"]?)(.*?)\1\s*\)/g,(a,q,v)=>'url('+JSON.stringify(asset(v,p))+')').replace(/(@import\s+)(['"])([^'"]+)\2/g,(a,b,q,v)=>b+q+asset(v,p)+q)}
for(const [p,b]of F)U.set(p,URL.createObjectURL(new Blob([b],{type:T[p]})));
for(let pass=0;pass<3;pass++)for(const [p,b]of F)if(/\.css$/i.test(p))U.set(p,URL.createObjectURL(new Blob([css(D.decode(b),p)],{type:'text/css'})));
for(const [p,b]of F)if(/\.[cm]?js$/i.test(p))U.set(p,URL.createObjectURL(new Blob([imports(D.decode(b),p)],{type:'text/javascript'})));
const nativeFetch=fetch.bind(window);window.fetch=(input,opts)=>{if(typeof input==='string'){const r=resolve(input,payload.entry);if(r&&U.has(r.p))return nativeFetch(U.get(r.p),opts)}return nativeFetch(input,opts)};
const doc=new DOMParser().parseFromString(D.decode(F.get(payload.entry)),'text/html');doc.querySelectorAll('base').forEach(e=>e.remove());
for(const el of doc.querySelectorAll('*')){for(const attr of ['src','href','poster','data'])if(el.hasAttribute(attr)){if(el.tagName==='A'&&attr==='href'){const r=resolve(el.getAttribute(attr),payload.entry);if(r&&/\.html?$/i.test(r.p)){el.setAttribute('data-zip-page',r.p+r.hash);el.setAttribute('href','#');continue}}el.setAttribute(attr,asset(el.getAttribute(attr),payload.entry))}if(el.hasAttribute('srcset')){send('warn',['srcset preview rewriting is not supported; using src fallback.']);el.removeAttribute('srcset')}if(el.hasAttribute('style'))el.setAttribute('style',css(el.getAttribute('style'),payload.entry))}
for(const e of doc.querySelectorAll('style'))e.textContent=css(e.textContent,payload.entry);
for(const e of doc.querySelectorAll('script:not([src])'))if(e.type==='module')e.textContent=imports(e.textContent,payload.entry);
const map={imports:{}};for(const [p,u]of U)map.imports[V+p]=u;
const existing=doc.querySelector('script[type="importmap"]');if(existing){try{const custom=JSON.parse(existing.textContent);Object.assign(map.imports,custom.imports||{});if(custom.scopes)map.scopes=custom.scopes}catch{}existing.remove()}
const im=doc.createElement('script');im.type='importmap';im.textContent=JSON.stringify(map);doc.head.prepend(im);
window.__zipNav=function(e){const a=e.target.closest('a[data-zip-page]');if(a){e.preventDefault();send('navigate',[a.dataset.zipPage])}};
const nav=doc.createElement('script');nav.textContent='document.addEventListener("click",window.__zipNav);';doc.body.append(nav);
document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close();send('ready',[payload.entry]);
}
function run(){save();const entry=$('entry').value;if(!entry||!files.has(entry))return status('No HTML entry. Source-only frameworks need to be built outside this editor.');$('console').textContent='';token=crypto.randomUUID();const payload={token,entry,files:[...files].map(([p,b])=>[p,Array.from(b)]),types:Object.fromEntries([...files.keys()].map(p=>[p,mime(p)]))};const source='('+sandboxBoot.toString()+')('+JSON.stringify(payload).replace(/</g,'\\u003c')+');';$('preview').srcdoc='<!doctype html><meta charset="utf-8"><script>'+source.replace(/<\/script/gi,'<\\/script')+'<\/script>';status('Running '+entry+' — preview uses rewritten local asset URLs, not a full web server.')} 
window.addEventListener('message',e=>{if(e.source!==$('preview').contentWindow||e.data?.zipbench!==token)return;const {kind,args}=e.data;if(kind==='navigate'){const p=args[0].split('#')[0];if(files.has(p)){$('entry').value=p;run()}else log('[missing] '+p)}else log('['+kind+'] '+args.join(' '))});
$('run').onclick=run;$('entry').onchange=run;$('width').onchange=()=>{$('preview').style.width=$('width').value;$('preview').style.maxWidth='100%'};
$('check').onclick=()=>{save();$('console').textContent='';let count=0;const entries=[...files.keys()].filter(p=>/\.html?$/i.test(p));log('HTML entries: '+entries.length);if(!entries.length){log('[warning] No HTML entry: export a built static site first.');count++}for(const [p,b]of files){if(!/\.(html?|css|[cm]?js)$/i.test(p))continue;const s=dec.decode(b);if(/(?:src|href)\s*=\s*['"]\/(?!\/)/i.test(s)){log('[warning] '+p+': root-relative URL may break on GitHub Pages repository subpaths.');count++}if(/(?:localhost|127\.0\.0\.1):\d+/.test(s)){log('[warning] '+p+': localhost dependency.');count++}if(/\b(?:require\s*\(|process\.env\b)/.test(s)){log('[warning] '+p+': possible Node/build-tool dependency.');count++}}if(files.has('package.json'))log('[note] package.json found. This editor does not install packages or run builds.');log('Static checks complete: '+count+' warning(s). These checks are heuristic, not a test suite.');status('Checks complete; see console.')};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();$('export').click()}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
files.set('index.html',enc.encode('<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>My website</title>\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n<h1>Hello from ZipBench</h1>\n<p>Edit the files, then run your site.</p>\n<button id="hello">Test JavaScript</button>\n<script src="app.js"><\/script>\n</body>\n</html>'));
files.set('style.css',enc.encode('body { font: 18px system-ui; padding: 3rem; background: #eef3ff; color: #18243d; }\nbutton { padding: .8rem; cursor: pointer; }'));
files.set('app.js',enc.encode('document.getElementById("hello").onclick = () => {\n  console.log("JavaScript is working!");\n  document.querySelector("h1").textContent = "Your test passed!";\n};'));
list();select('index.html');status(window.JSZip?'Ready. Open a ZIP or edit the starter project.':'ZIP library could not load. Check your connection; preview/editor still work.');run();
</script></body></html>
