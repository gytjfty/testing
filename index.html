<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZipPad — editor & preview</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#11151d;color:#e4eaf4}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}header{padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #344055}button,select,input{background:#243047;color:inherit;border:1px solid #455775;border-radius:5px;padding:7px}button{cursor:pointer}button:hover{background:#354967}strong{margin-right:12px}main{display:grid;grid-template-columns:210px minmax(250px,1fr) minmax(300px,1fr);flex:1;min-height:0}aside{padding:10px;overflow:auto;border-right:1px solid #344055}.file{display:block;width:100%;text-align:left;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:transparent;border:0}.file.active{background:#30476b}.panel{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid #344055}.bar{padding:8px;background:#1b2331;display:flex;gap:8px;align-items:center;flex-wrap:wrap}textarea{resize:none;flex:1;width:100%;border:0;outline:none;background:#121923;color:#dce8fa;padding:14px;font:14px/1.55 ui-monospace,Consolas,monospace;tab-size:2;white-space:pre}iframe{width:100%;flex:1;border:0;background:white;min-height:100px}#console{height:150px;overflow:auto;background:#0c1017;padding:8px;font:12px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#ff9b9b}.warn{color:#f0cc82}footer{padding:7px 12px;color:#b5c5dc;border-top:1px solid #344055;font-size:12px}#filename{overflow:hidden;text-overflow:ellipsis}#entry{max-width:220px}small{color:#b5c5dc}@media(max-width:850px){main{grid-template-columns:130px 1fr;overflow:auto}.preview{grid-column:1/-1;min-height:460px}body{height:auto;min-height:100vh}main>.panel:not(.preview){height:440px}aside{max-height:440px}}
</style></head><body>
<header><strong>ZipPad</strong><button id="open">Open ZIP</button><input id="zip" type="file" accept=".zip" hidden><button id="add">Add files</button><input id="uploads" type="file" multiple hidden><button id="new">New file</button><button id="rename">Rename</button><button id="delete">Delete</button><button id="export">Export ZIP</button><button id="download">Save file</button><button id="run">Run ▶</button><button id="stop">Stop</button><button id="full">Fullscreen</button></header>
<main><aside><small>PROJECT FILES</small><div id="files"></div></aside><section class="panel"><div class="bar"><span id="filename">No file</span><small id="kind"></small></div><textarea id="editor" spellcheck="false" aria-label="Code editor"></textarea></section><section class="panel preview"><div class="bar"><label>Entry <select id="entry"></select></label><label><input type="checkbox" id="auto"> Auto-run</label><button id="clear">Clear console</button></div><iframe id="preview" title="Project preview" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen" allowfullscreen></iframe><div id="console" aria-label="Preview console"></div></section></main>
<footer id="status">Ready. Click inside the demo to lock the pointer; Esc releases it. Export your changes before closing.</footer>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), files=new Map(), decoder=new TextDecoder(), encoder=new TextEncoder();
let active='',urls=[],timer,runId=0,token='';
const textExt=/\.(html?|css|js|mjs|json|txt|md|svg|xml|csv|glsl|vert|frag|ts|tsx|jsx|yml|yaml|toml|map)$/i;
const isText=n=>textExt.test(n)||!n.split('/').pop().includes('.');
const mime=n=>({'html':'text/html','htm':'text/html','css':'text/css','js':'text/javascript','mjs':'text/javascript','json':'application/json','svg':'image/svg+xml','png':'image/png','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif','webp':'image/webp','ico':'image/x-icon','woff':'font/woff','woff2':'font/woff2','ttf':'font/ttf','mp3':'audio/mpeg','wav':'audio/wav','ogg':'audio/ogg','mp4':'video/mp4','glb':'model/gltf-binary'}[n.split('.').pop().toLowerCase()]||'application/octet-stream');
function normalize(s){const out=[];for(const part of s.replace(/\\/g,'/').split('/')){if(!part||part==='.')continue;if(part==='..')out.pop();else out.push(part)}return out.join('/')}
function status(s){$('status').textContent=s}
function log(s,type=''){const line=document.createElement('div');line.className=type;line.textContent=s;$('console').append(line);$('console').scrollTop=$('console').scrollHeight}
function save(){if(active&&files.has(active)&&isText(active))files.set(active,encoder.encode($('editor').value))}
function refresh(){const list=$('files');list.replaceChildren();for(const name of [...files.keys()].sort()){const b=document.createElement('button');b.className='file'+(name===active?' active':'');b.textContent=name;b.title=name;b.onclick=()=>select(name);list.append(b)}const old=$('entry').value;$('entry').replaceChildren();for(const name of [...files.keys()].filter(n=>/\.html?$/i.test(n)).sort()){const o=new Option(name,name);$('entry').add(o)}if(files.has(old))$('entry').value=old;else{const first=[...files.keys()].find(n=>/(^|\/)index\.html?$/i.test(n));if(first)$('entry').value=first}}
function select(name){save();active=name;$('filename').textContent=name;$('editor').disabled=!isText(name);$('editor').value=isText(name)?decoder.decode(files.get(name)):'Binary asset — preserved in ZIP export.';$('kind').textContent=isText(name)?'':'(binary)';refresh()}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function stop(){runId++;$('preview').srcdoc='';for(const u of urls)URL.revokeObjectURL(u);urls=[];token=''}
function resolve(ref,base){if(!ref||/^(?:[a-z][\w+.-]*:|\/\/|#)/i.test(ref))return null;const clean=ref.split(/[?#]/)[0];try{return normalize((clean.startsWith('/')?'':base.slice(0,base.lastIndexOf('/')+1))+decodeURIComponent(clean))}catch{return null}}
async function run(){save();stop();const id=runId,entry=$('entry').value;if(!entry||!files.has(entry)){status('Choose an HTML entry file.');return}token=crypto.getRandomValues(new Uint32Array(4)).join('-');const thisToken=token;const built=new Map(),busy=new Set();
function asset(name){if(built.has(name))return built.get(name);if(!files.has(name)||busy.has(name))return null;busy.add(name);let data=files.get(name);if(/\.css$/i.test(name)){let css=decoder.decode(data);css=css.replace(/url\(\s*(['"]?)(.*?)\1\s*\)/gi,(all,q,ref)=>{const path=resolve(ref,name),u=path&&asset(path);return u?'url("'+u+'")':all});css=css.replace(/@import\s+(['"])(.*?)\1/gi,(all,q,ref)=>{const path=resolve(ref,name),u=path&&asset(path);return u?'@import "'+u+'"':all});data=css}const u=URL.createObjectURL(new Blob([data],{type:mime(name)}));urls.push(u);built.set(name,u);busy.delete(name);return u}
const doc=new DOMParser().parseFromString(decoder.decode(files.get(entry)),'text/html');doc.querySelectorAll('base').forEach(n=>n.remove());
for(const el of doc.querySelectorAll('[src],[href],[poster],[style],[srcset],style')){for(const attr of ['src','href','poster']){if(!el.hasAttribute(attr))continue;if(attr==='href'&&el.tagName!=='LINK')continue;const ref=el.getAttribute(attr),path=resolve(ref,entry);if(path&&files.has(path)){el.setAttribute(attr,asset(path));if(el.tagName==='SCRIPT'||el.tagName==='LINK'){el.removeAttribute('integrity');el.removeAttribute('crossorigin')}}else if(path)log('Unresolved local resource: '+ref,'warn')}
const fixCss=s=>s.replace(/url\(\s*(['"]?)(.*?)\1\s*\)/gi,(all,q,ref)=>{const path=resolve(ref,entry),u=path&&asset(path);return u?'url("'+u+'")':all});if(el.hasAttribute('style'))el.setAttribute('style',fixCss(el.getAttribute('style')));if(el.tagName==='STYLE')el.textContent=fixCss(el.textContent);if(el.hasAttribute('srcset'))log('srcset rewriting is not supported; use src for local preview assets.','warn')}
const map={};for(const name of files.keys())if(!/\.html?$/i.test(name))map[name]=asset(name);
const boot=document.createElement('script');boot.textContent=`(()=>{const token=${JSON.stringify(thisToken)},paths=${JSON.stringify(map)},entry=${JSON.stringify(entry)};const send=(kind,args)=>{parent.postMessage({zipPad:token,kind,args:args.map(v=>{try{return typeof v==='string'?v:JSON.stringify(v)}catch{return String(v)}})},'*')};for(const kind of ['log','info','warn','error']){const original=console[kind];console[kind]=(...args)=>{send(kind,args);original.apply(console,args)}}addEventListener('error',e=>send('error',[e.message||'Resource failed to load',e.filename||'',e.lineno||'']),true);addEventListener('unhandledrejection',e=>send('error',[String(e.reason)]));const oldFetch=window.fetch.bind(window);window.fetch=(input,init)=>{if(typeof input==='string'&&!/^(?:[a-z][\\w+.-]*:|\\/\\/|#)/i.test(input)){const out=[];const raw=(input.startsWith('/')?'':entry.slice(0,entry.lastIndexOf('/')+1))+input.split(/[?#]/)[0];for(const p of decodeURIComponent(raw).split('/')){if(p==='..')out.pop();else if(p&&p!=='.')out.push(p)}const path=out.join('/');if(paths[path])input=paths[path]}return oldFetch(input,init)};document.addEventListener('pointerlockchange',()=>send('info',[document.pointerLockElement?'Pointer locked — Esc to release':'Pointer released']));document.addEventListener('pointerlockerror',()=>send('error',['Pointer lock rejected. Click inside the preview and try again.']));})();`;
doc.head.prepend(boot);if(id!==runId)return;$('preview').srcdoc='<!doctype html>\n'+doc.documentElement.outerHTML;status('Running '+entry+' — click inside the preview for pointer lock.');if(doc.querySelector('script[type="module"]'))log('Module imports are not bundled. Relative ES module imports may fail; build the project first.','warn')}
window.addEventListener('message',e=>{if(e.source!==$('preview').contentWindow||!token||e.data?.zipPad!==token)return;const d=e.data;if(Array.isArray(d.args))log(d.args.join(' '),d.kind==='error'?'error':d.kind==='warn'?'warn':'')});
$('editor').addEventListener('input',()=>{save();status('Changes in memory — export ZIP to keep them.');clearTimeout(timer);if($('auto').checked)timer=setTimeout(()=>run().catch(e=>log(e.message,'error')),650)});
$('editor').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target,a=t.selectionStart,b=t.selectionEnd;t.setRangeText('  ',a,b,'end');t.dispatchEvent(new Event('input'))}});
$('open').onclick=()=>$('zip').click();$('zip').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(files.size&&!confirm('Replace this project? Export first to keep changes.'))return;try{if(!window.JSZip)throw Error('ZIP library unavailable. Connect to the internet and reload.');if(f.size>50*1024*1024)throw Error('ZIP exceeds the 50 MB import limit.');status('Reading ZIP…');const z=await JSZip.loadAsync(f),next=new Map();let bytes=0;const entries=Object.values(z.files).filter(x=>!x.dir&&!x.name.startsWith('__MACOSX/'));if(entries.length>2000)throw Error('Too many files (limit 2,000).');for(const item of entries){const data=await item.async('uint8array');bytes+=data.length;if(bytes>100*1024*1024)throw Error('Unpacked project exceeds 100 MB.');next.set(normalize(item.name),data)}stop();files.clear();for(const [n,b]of next)files.set(n,b);active='';refresh();if(files.size)select($('entry').value||files.keys().next().value);status('ZIP loaded. Choose an entry and press Run.')}catch(err){status(err.message);log(err.message,'error')}finally{e.target.value=''}};
$('add').onclick=()=>$('uploads').click();$('uploads').onchange=async e=>{save();for(const f of e.target.files)files.set(normalize(f.name),new Uint8Array(await f.arrayBuffer()));refresh();e.target.value='';status('Files added. Export ZIP to save.')};
$('new').onclick=()=>{const raw=prompt('File path, for example scripts/game.js');if(!raw)return;const n=normalize(raw);if(!n)return;if(files.has(n)){select(n);return}files.set(n,new Uint8Array());select(n)};
$('rename').onclick=()=>{if(!active)return;const raw=prompt('New path (references are not updated automatically)',active);if(!raw)return;const n=normalize(raw);if(!n||n===active)return;if(files.has(n)){alert('That file already exists.');return}save();files.set(n,files.get(active));files.delete(active);active='';select(n)};
$('delete').onclick=()=>{if(!active||!confirm('Delete '+active+'?'))return;files.delete(active);active='';$('editor').value='';$('filename').textContent='No file';refresh();if(files.size)select(files.keys().next().value)};
$('export').onclick=async()=>{try{save();if(!window.JSZip)throw Error('ZIP library unavailable. Connect to the internet and reload.');const z=new JSZip();for(const [n,data]of files)z.file(n,data);download(await z.generateAsync({type:'blob',compression:'DEFLATE'}),'project.zip');status('ZIP exported.')}catch(e){status(e.message)}};
$('download').onclick=()=>{save();if(active)download(new Blob([files.get(active)],{type:mime(active)}),active.split('/').pop())};
$('run').onclick=()=>run().catch(e=>log(e.message,'error'));$('stop').onclick=()=>{clearTimeout(timer);stop();status('Stopped.')};$('clear').onclick=()=>$('console').replaceChildren();$('full').onclick=()=>{$('preview').requestFullscreen().catch(e=>log(e.message,'error'))};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('run').click()}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();$('export').click()}});window.addEventListener('beforeunload',e=>{e.preventDefault();e.returnValue=''});
const demo=`<!doctype html><html><head><meta charset="utf-8"><title>Pointer lock test</title><link rel="stylesheet" href="style.css"></head><body><canvas id="game"></canvas><div id="help">Click to capture the mouse · Esc to release<br>Move the mouse to move the crosshair.</div><script src="game.js"><\/script></body></html>`;
files.set('index.html',encoder.encode(demo));files.set('style.css',encoder.encode('html,body{margin:0;height:100%;overflow:hidden;background:#101827;color:#e2edff;font:15px system-ui}canvas{width:100%;height:100%;display:block}#help{position:absolute;top:20px;left:20px;pointer-events:none;line-height:1.7}'));
files.set('game.js',encoder.encode(`const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');let x=200,y=200;function draw(){canvas.width=innerWidth;canvas.height=innerHeight;ctx.fillStyle='#111e32';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#253b59';for(let i=0;i<canvas.width;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke()}for(let i=0;i<canvas.height;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(canvas.width,i);ctx.stroke()}ctx.strokeStyle='#70e1bc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+14,y);ctx.moveTo(x,y-14);ctx.lineTo(x,y+14);ctx.stroke()}canvas.addEventListener('click',async()=>{try{await canvas.requestPointerLock()}catch(e){console.error(e.message)}});document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;x=Math.max(0,Math.min(innerWidth,x+e.movementX));y=Math.max(0,Math.min(innerHeight,y+e.movementY));draw()});addEventListener('resize',draw);draw();console.log('Pointer-lock demo ready. Click the canvas.');`));refresh();select('index.html');run().catch(e=>log(e.message,'error'));
</script></body></html>
